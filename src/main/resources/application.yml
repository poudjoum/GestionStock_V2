#
# Aucune valeur secrete ici : tout vient de l'environnement (voir .env.example). Ce fichier est
# versionne et l'a longtemps ete avec le mot de passe de la base, le secret JWT et les quatre cles
# Flickr en clair.
#
# Les variables sans valeur de repli (`${VAR}`) font echouer le demarrage si elles manquent. C'est
# voulu pour les secrets : une application qui demarre sur un secret de repli signe des jetons que
# n'importe qui peut fabriquer.
#
server:
   port: ${SERVER_PORT:9092}

spring:
   application:
     name: Gestion de Stock
   datasource:
     url: ${DB_URL:jdbc:postgresql://localhost:5432/gestionstock}
     username: ${DB_USERNAME:gestionstock}
     password: ${DB_PASSWORD}
     driver-class-name: org.postgresql.Driver
   jpa:
     show-sql: true
     hibernate:
       # Le schema appartient desormais aux migrations Flyway. `validate` confronte le mapping a la
       # base au demarrage : une entite modifiee sans migration echoue ici, plutot qu'a la premiere
       # requete en production.
       ddl-auto: validate
     open-in-view: false
   flyway:
     enabled: true
     locations: classpath:db/migration
   # SMTP. Vide tant que EMAIL_HOST n'est pas renseigne : la file des courriels attend alors sans
   # rien perdre, et repart telle quelle le jour ou les variables arrivent.
   mail:
     host: ${EMAIL_HOST:}
     port: ${EMAIL_PORT:587}
     username: ${EMAIL_USERNAME:}
     password: ${EMAIL_PASSWORD:}
     properties:
       mail:
         smtp:
           auth: true
           starttls:
             enable: true
         # Ne pas rester pendu sur un serveur muet : l'expediteur reprendra au passage suivant.
         connectiontimeout: 10000
         timeout: 10000
         writetimeout: 10000
   servlet:
     multipart:
       max-file-size: 5MB
       max-request-size: 5MB
       file-size-threshold: 2KB

flickr:
  apiKey: ${FLICKR_API_KEY:}
  apiSecret: ${FLICKR_API_SECRET:}
  appKey: ${FLICKR_APP_KEY:}
  appSecret: ${FLICKR_APP_SECRET:}

springdoc:
  api-docs:
    path: /api-GestionStock

app:
  # Le fuseau dans lequel se lisent les journees : la caisse du 21 septembre est celle du jour
  # civil local, pas celle de l'horloge du serveur. Le conteneur tourne en UTC et l'ecart d'une
  # heure suffirait a faire basculer les encaissements du soir sur le lendemain.
  fuseauHoraire: ${FUSEAU_HORAIRE:Africa/Douala}
  jwtSecret: ${JWT_SECRET}
  # En millisecondes : 3600000 = 1 h. La valeur precedente, 3600, etait lue en millisecondes et
  # donnait des jetons valables 3,6 secondes ; elle est passee ensuite a 24 h, faute de pouvoir
  # renouveler un jeton autrement qu'en se reconnectant.
  #
  # Une heure depuis que le jeton de rafraichissement existe : un JWT ne se revoque pas, et c'est
  # sa duree qui decide combien de temps un compte ferme continue d'ouvrir les portes.
  jwtExpirationMS: ${JWT_EXPIRATION_MS:3600000}
  # 30 jours. Le jeton de rafraichissement, lui, vit en base : il se revoque, et c'est ce qui
  # permet de rendre le jeton d'acces court sans obliger un caissier a se reconnecter chaque heure.
  jwtRefreshExpirationMS: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  # Les origines autorisees a appeler l'API depuis un navigateur, separees par des virgules.
  #
  # Jamais « * » : l'etoile etait posee sur la seule route de connexion, ce qui laissait le front
  # se connecter puis se faire refuser tout le reste. Nommer les origines coute une variable
  # d'environnement et evite d'ouvrir l'API a n'importe quelle page du web.
  corsOrigines: ${CORS_ORIGINES:http://localhost:4200,http://127.0.0.1:4200}
  notifications:
    # L'adresse qui figure comme expediteur des courriels. Vide, c'est celle du compte SMTP.
    expediteur: ${EMAIL_FROM:}
    # Entre deux passages de l'expediteur, en millisecondes. Une minute : un courriel n'est pas
    # une alarme, et interroger la file plus souvent ne ferait que du bruit en base.
    intervalleMs: ${NOTIFICATIONS_INTERVALLE_MS:60000}
