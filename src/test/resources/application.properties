# Configuration des tests. L'application refuse de demarrer sans JWT_SECRET ni DB_PASSWORD ;
# ici, ces valeurs sont fixees en clair, ce qui est sans risque : elles ne signent que des jetons
# de test, et la base est un conteneur jetable cree par Testcontainers.
app.jwtSecret=dGVzdC1zZWNyZXQtZGUtc2lnbmF0dXJlLXBvdXItbGVzLXRlc3RzLXVuaXF1ZW1lbnQtMDEyMzQ1Njc4OQ==
app.jwtExpirationMS=3600000

# L'URL, l'utilisateur et le mot de passe viennent du conteneur (@ServiceConnection) ; la valeur
# ci-dessous evite seulement que ${DB_PASSWORD}, sans repli, ne fasse echouer le demarrage.
spring.datasource.password=test

spring.jpa.show-sql=false

# L'expediteur ne doit pas se declencher tout seul pendant une campagne : les tests appellent
# `traiterLaFile` eux-memes, pour ne dependre d'aucune horloge. Une heure de delai initial suffit
# a garantir qu'il ne passera jamais de lui-meme.
app.notifications.intervalleMs=3600000
