# Deploiement sur le serveur Ubuntu partage (jumpy@192.168.1.100).
#
# Ce serveur heberge deja livraison, hotspot, tontinepro, pressing, genealogie et le site hotspot.
# Rien n'est mis en commun avec eux :
#   - reseau Docker dedie ;
#   - PostgreSQL dedie, sans port publie sur l'hote — joignable par ce seul reseau ;
#   - volume nomme propre au projet ;
#   - journaux plafonnes, le disque de l'hote etant a moitie plein ;
#   - port 9092, verifie libre avant le premier demarrage.
#
#   docker compose -p gestionstock -f docker-compose.prod.yml up -d
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: gestionstock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [gestionstock]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    build:
      context: .
    image: gestionstock:latest
    container_name: gestionstock-app
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SERVER_PORT: 9092
      # Depuis un conteneur, la base n'est pas sur localhost mais sur le nom du service.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-2592000000}
      # L'amorcage du super-administrateur. Vides, rien ne se passe : c'est le cas d'une
      # installation deja amorcee. Renseignees, le compte est cree au demarrage s'il n'existe pas,
      # et jamais modifie s'il existe.
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_MOTDEPASSE: ${SUPER_ADMIN_MOTDEPASSE:-}
      # Les origines du front autorisees a appeler l'API depuis un navigateur.
      CORS_ORIGINES: ${CORS_ORIGINES:-http://localhost:4200,http://127.0.0.1:4200}
      # SMTP. Vide, la file des courriels attend sans rien perdre ni rien faire echouer.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      NOTIFICATIONS_INTERVALLE_MS: ${NOTIFICATIONS_INTERVALLE_MS:-60000}
      # Le conteneur tourne en UTC : sans ce fuseau, l'etat de caisse d'une journee irait de
      # 01h00 a 01h00 en heure locale.
      FUSEAU_HORAIRE: ${FUSEAU_HORAIRE:-Africa/Douala}
      FLICKR_API_KEY: ${FLICKR_API_KEY:-}
      FLICKR_API_SECRET: ${FLICKR_API_SECRET:-}
      FLICKR_APP_KEY: ${FLICKR_APP_KEY:-}
      FLICKR_APP_SECRET: ${FLICKR_APP_SECRET:-}
    ports:
      # APP_BIND vaut 0.0.0.0 pour que l'API soit joignable depuis le LAN pendant le
      # developpement. La passer a 127.0.0.1 la referme sur le serveur seul, sans rien changer
      # d'autre.
      - "${APP_BIND:-0.0.0.0}:9092:9092"
    networks: [gestionstock]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Le front, servi par nginx, qui relaie aussi l'API sous la meme origine.
  #
  # Une seule origine pour le navigateur : la question du CORS ne se pose donc plus depuis
  # l'application deployee, et l'on peut l'ouvrir depuis un telephone du reseau sans avoir
  # declare son adresse nulle part.
  web:
    build:
      context: ./frontend
    image: gestionstock-web:latest
    container_name: gestionstock-web
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-9093}:80"
    networks: [gestionstock]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # La terminaison TLS.
  #
  # Pourquoi du HTTPS sur un reseau local : le navigateur reserve aux origines sures tout un pan
  # de ses capacites. `crypto.randomUUID` n'existe pas en clair — l'encaissement a echoue dessus
  # en production — et le service worker ne s'enregistre pas du tout. L'application est declaree
  # installable et capable de fonctionner hors ligne ; en HTTP elle n'est ni l'un ni l'autre.
  #
  # Son propre Caddy, et non un site ajoute a celui d'un autre projet de la machine : cela lierait
  # les deux deploiements, et redeployer l'un ferait disparaitre le site de l'autre sans prevenir.
  # Le prix de cette separation est une seconde autorite de certification a installer sur les
  # appareils du magasin — une fois par appareil.
  caddy:
    image: caddy:2-alpine
    container_name: gestionstock-caddy
    restart: unless-stopped
    depends_on: [web]
    environment:
      # L'hote seul : ni schema ni port. L'adresse du serveur sur le reseau, ou le nom de domaine
      # le jour ou il y en aura un.
      SERVER_NAME: ${SERVER_NAME:-localhost}
      # `internal` pour l'autorite locale ; une adresse de courriel pour Let's Encrypt.
      TLS_MODE: ${TLS_MODE:-internal}
      HTTPS_PORT: ${HTTPS_PORT:-9443}
    ports:
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-9443}:${HTTPS_PORT:-9443}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # L'autorite de certification vit ici. La perdre obligerait a reinstaller le certificat
      # racine sur chaque appareil du magasin : ce volume ne se supprime pas a la legere.
      - caddydata:/data
      - caddyconfig:/config
    networks: [gestionstock]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  gestionstock:
    name: gestionstock

volumes:
  pgdata:
    name: gestionstock-pgdata
  caddydata:
    name: gestionstock-caddy-data
  caddyconfig:
    name: gestionstock-caddy-config
