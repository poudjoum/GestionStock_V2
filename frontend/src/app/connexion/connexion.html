@let charge = enCours();

<gs-cadre-connexion
  titre="Connexion"
  texte="Avec l’identifiant et le mot de passe que vous a remis votre magasin."
>
    <form class="flex flex-col gap-2" (ngSubmit)="soumettre()">
      <mat-form-field appearance="outline">
        <mat-label>Identifiant</mat-label>
        <input
          matInput
          name="username"
          autocomplete="username"
          autocapitalize="none"
          autocorrect="off"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          [disabled]="charge"
          required
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mot de passe</mat-label>
        <input
          matInput
          type="password"
          name="password"
          autocomplete="current-password"
          [ngModel]="motDePasse()"
          (ngModelChange)="motDePasse.set($event)"
          [disabled]="charge"
          required
        />
      </mat-form-field>

      @if (erreur(); as message) {
        <p class="message-erreur" role="alert">
          <mat-icon aria-hidden="true">error_outline</mat-icon>
          <span>{{ message }}</span>
        </p>
      }

      <button mat-flat-button type="submit" class="mt-2 !h-12" [disabled]="charge">
        {{ charge ? 'Connexion…' : 'Se connecter' }}
      </button>

      @if (charge) {
        <mat-progress-bar mode="indeterminate" />
      }
    </form>
</gs-cadre-connexion>
