server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les fichiers sont deja compresses a la construction ; le faire ici economise la bande
    # passante d'une connexion de telephone, qui est ce qui coute le plus cher au chargement.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    #
    # L'API, relayee sous la meme origine que le front.
    #
    # C'est tout l'interet de servir les deux par le meme nginx : le navigateur ne voit qu'une
    # seule origine, et la question du CORS ne se pose plus. Sans cela, il faudrait declarer dans
    # CORS_ORIGINES chaque adresse depuis laquelle on ouvre l'application — l'IP du serveur, le
    # nom de domaine, celui du telephone — et en oublier une se paie par un ecran vide sans
    # message.
    #
    location ~ ^/(api|gestiondestock|api-GestionStock|swagger-ui|v3/api-docs) {
        proxy_pass http://gestionstock-app:9092;
        proxy_http_version 1.1;

        # L'en-tete `Origin` est efface, et ce n'est pas un detail.
        #
        # Chrome l'envoie sur toute requete POST, y compris de meme origine. Spring, lui, n'en
        # sait rien : son filtre CORS voit une origine, la compare a CORS_ORIGINES, ne la trouve
        # pas et repond 403 — alors que la requete est bel et bien de meme origine et que le
        # navigateur n'a rien a verifier. C'est exactement ce qui est arrive au premier essai
        # depuis un navigateur, la ou curl passait sans probleme.
        #
        # L'effacer dit au backend la verite du point de vue de nginx : cette requete vient de
        # chez lui. C'est ce qui permet d'ouvrir l'application depuis n'importe quelle adresse —
        # l'IP du serveur, un nom de domaine, un telephone — sans rien declarer cote serveur.
        proxy_set_header Origin "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une construction d'image ou une migration Flyway peut faire attendre le demarrage.
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Les fichiers produits par Angular portent une empreinte dans leur nom : ils ne changent
    # jamais sans changer de nom, et peuvent donc etre gardes un an.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # `index.html`, lui, ne se garde pas : c'est lui qui nomme les fichiers empreintes, et un
    # index en cache ferait charger l'ancienne version apres chaque deploiement.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Le service worker non plus, pour la meme raison : c'est lui qui decide du reste.
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }

    #
    # Toutes les autres adresses rendent index.html.
    #
    # Les routes d'Angular n'existent pas sur le disque : ouvrir directement /factures, ou
    # rafraichir la page dessus, donnerait un 404 sans cette ligne. C'est l'oubli le plus frequent
    # quand on sert une application a page unique.
    #
    location / {
        try_files $uri $uri/ /index.html;
    }
}
