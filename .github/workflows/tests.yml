# Les tests, a chaque poussee. C'est cette conclusion que le serveur interroge avant de deployer.
#
# Chez GitHub, sur une machine qu'il fournit — et non sur le serveur. Un runner auto-heberge sur
# un depot public ferait executer sur la machine de production le code de n'importe quelle pull
# request venue de l'exterieur. Le serveur, lui, ne fait que lire le resultat.
name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verifier:
    name: Backend et front
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Les tests d'integration montent un PostgreSQL jetable par Testcontainers : le Docker de
      # la machine GitHub suffit, il n'y a pas de service a declarer.
      - name: Tests du backend
        run: ./mvnw -B test

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Le front se construit aussi, et ce n'est pas une formalite : un lot entier peut ne toucher
      # que l'Angular. Sans cette etape, un front casse partirait en production derriere des tests
      # de backend parfaitement verts.
      - name: Construction du front
        working-directory: frontend
        run: |
          npm ci
          npm run build
