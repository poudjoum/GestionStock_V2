# Le site de presentation : des fichiers statiques, rien d'autre.
#
# Il ne relaie pas l'API et ne connait pas l'application : il vit a cote, sur son propre nom
# (gestionstock.tontinepro.uk), pour qu'une erreur ici ne touche jamais la caisse.

# Les polices et les images ne changent qu'avec le site : un mois de cache. Les pages, la feuille
# de style et l'APK se revalident a chaque visite, pour qu'une correction se voie tout de suite.
#
# Une table plutot qu'un `add_header` par `location` : nginx oublie les en-tetes du serveur dans
# toute `location` qui pose les siens, et les en-tetes de securite disparaitraient des pages.
map $uri $gs_cache {
    ~*\.(woff2|svg|png|webp)$ "public, max-age=2592000";
    default                   "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # « /docs » redirige vers « /docs/ » : en chemin relatif, sinon nginx ecrit « http://…/docs/ »
    # avec son propre port, et le visiteur arrive par https sur le 443 du tunnel.
    absolute_redirect off;

    add_header Cache-Control $gs_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # « /docs » et « /docs/ » menent au meme endroit ; une adresse inconnue rend la vraie 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # L'APK de l'application des clients, depose a la main a chaque version (voir le README).
    location /telechargements/ {
        types { application/vnd.android.package-archive apk; }
    }

    gzip on;
    gzip_types text/css image/svg+xml;
}
